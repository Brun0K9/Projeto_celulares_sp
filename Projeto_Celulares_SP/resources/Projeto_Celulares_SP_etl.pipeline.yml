# The main pipeline for Projeto_Celulares_SP

resources:
  pipelines:
    Projeto_Celulares_SP_etl:
      name: Projeto_Celulares_SP_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/Projeto_Celulares_SP_etl"

      libraries:
        - glob:
            include: ../src/Projeto_Celulares_SP_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
