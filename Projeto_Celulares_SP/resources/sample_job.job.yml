# A job for ingestão e bronze do Projeto Celular SP

resources:
  jobs:
    projeto_celular_sp_job:
      name: Job_projeto_celular_sp
      trigger:
        # Exemplo: rodar uma vez por dia (customize depois!)
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: ingestao_celulares_ssp
          notebook_task:
            notebook_path: ../src/Notebooks/ingestao_celulares_ssp.ipynb
        - task_key: bronze_celulares_sp
          depends_on:
            - task_key: ingestao_celulares_ssp
          notebook_task:
            notebook_path: ../src/Notebooks/bronze_celulares_sp.ipynb
      # (opcional) Notificações e parâmetros
      email_notifications:
        on_failure: 
          - 'bruno.xavier@foursys.com.br'
      # parameters:
      #   - name: catalog
      #     default: workspace
      #   - name: schema
      #     default: treinamentos